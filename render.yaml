services:
  - type: web
    name: d365-project-lifecycle-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: D365_ENVIRONMENT
        sync: false
      - key: D365_BASE_URL
        sync: false
      - key: D365_TENANT_ID
        sync: false
      - key: D365_CLIENT_ID
        sync: false
      - key: D365_CLIENT_SECRET
        sync: false
      - key: D365_DATA_AREA_ID
        value: "2020"
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: OUTPUT_DIR
        value: "./output"
